<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mitmachen – Deine Welt, deine Zukunft</title>
  <meta name="description" content="Die 7-Tage-Challenge für Jugendliche: ein kleiner Schritt pro Tag.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="nav">
    <a class="brand" href="index.html">🌍 <span>Deine Welt</span></a>
    <ul>
      <li><a href="index.html">Start</a></li>
      <li><a href="fakten.html">Fakten</a></li>
      <li><a href="schule.html">Schule</a></li>
      <li><a href="tipps.html">Tipps</a></li>
      <li><a href="mitmachen.html" aria-current="page">Mitmachen</a></li>
    </ul>
  </nav>

  <header class="page-hero">
    <div class="blob b1"></div>
    <div class="blob b3"></div>
    <span class="emoji">🏆</span>
    <h1><span class="grad">7-Tage-Challenge</span></h1>
    <p>Ein Schritt pro Tag. Hake ab, was du schaffst.</p>
  </header>

  <section class="section">
    <div class="progress reveal"><div class="bar"></div></div>

    <ul class="checklist">
      <li class="reveal"><label><input type="checkbox"><span class="tag">Tag 1</span><span class="txt">🚰 Trinkflasche statt Einwegflasche</span></label></li>
      <li class="reveal"><label><input type="checkbox"><span class="tag">Tag 2</span><span class="txt">🍱 Pausenbrot in der Brotdose</span></label></li>
      <li class="reveal"><label><input type="checkbox"><span class="tag">Tag 3</span><span class="txt">🔌 Alle Geräte nachts komplett aus</span></label></li>
      <li class="reveal"><label><input type="checkbox"><span class="tag">Tag 4</span><span class="txt">🚿 2 Minuten kürzer duschen</span></label></li>
      <li class="reveal"><label><input type="checkbox"><span class="tag">Tag 5</span><span class="txt">🚲 Kurze Strecke mit Rad oder zu Fuß</span></label></li>
      <li class="reveal"><label><input type="checkbox"><span class="tag">Tag 6</span><span class="txt">🥗 Ein fleischfreier Tag</span></label></li>
      <li class="reveal"><label><input type="checkbox"><span class="tag">Tag 7</span><span class="txt">♻️ Etwas weitergeben statt wegwerfen</span></label></li>
    </ul>

    <div class="win" aria-live="polite"></div>
  </section>

  <section class="section dark">
    <h2 class="reveal">Jeder Beitrag zählt</h2>
    <p class="big reveal">Nicht wenige, die alles perfekt machen,<br>sondern <strong>viele</strong>, die kleine Schritte gehen.</p>
    <div class="pulse reveal">🌱</div>
    <p class="big reveal" style="margin-top:1.5rem">Erzähl es weiter: Freunde, Familie, Klasse.</p>
  </section>

  <script src="script.js"></script>
</body>
</html>
